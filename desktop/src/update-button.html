<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Update</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: InterVariable, Inter, "Segoe UI", sans-serif; }
    button {
      /* White with the URY POS primary, so it is not mistaken for the keyboard button. */
      position: relative;
      width: 56px; height: 56px; margin: 4px; padding: 0;
      border: 2px solid #2563eb; border-radius: 50%; cursor: pointer;
      background: #ffffff; color: #2563eb;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .25);
      display: flex; align-items: center; justify-content: center;
      opacity: .9; touch-action: none;
    }
    button:hover { opacity: 1; background: #eff6ff; }
    button.pressed { transform: scale(.94); }
    button.ok { border-color: #16a34a; color: #16a34a; }
    button.error { border-color: #dc2626; color: #dc2626; }
    svg { width: 28px; height: 28px; pointer-events: none; }
    .busy #sync { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #check, #alert { display: none; }
    .ok #sync, .error #sync { display: none; }
    .ok #check { display: block; }
    .error #alert { display: block; }
    /* Download progress, and a dot when a downloaded update is waiting. */
    #progress {
      position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
      background: #2563eb; color: #fff; border-radius: 8px; padding: 0 5px;
      font-size: 10px; font-weight: 600; line-height: 15px; display: none; pointer-events: none;
    }
    #dot {
      position: absolute; top: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%;
      background: #16a34a; border: 2px solid #fff; display: none; pointer-events: none;
    }
    .ready #dot { display: block; }
  </style>
</head>
<body>
  <button id="update" type="button" title="Update URY POS now (drag to move)" aria-label="Update URY POS now">
    <svg id="sync" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/>
      <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/>
    </svg>
    <svg id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12.5l4.5 4.5L19 7.5"/>
    </svg>
    <svg id="alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6v8M12 18h.01"/>
    </svg>
    <span id="progress"></span>
    <span id="dot"></span>
  </button>
  <script>
    const button = document.getElementById('update');
    const progress = document.getElementById('progress');
    let down = false;
    button.addEventListener('pointerdown', (event) => {
      down = true;
      button.setPointerCapture(event.pointerId);
      button.classList.add('pressed');
      window.floatingButton.pointer('down');
    });
    button.addEventListener('pointermove', () => { if (down) window.floatingButton.pointer('move'); });
    const finish = (phase) => () => {
      if (!down) return;
      down = false;
      button.classList.remove('pressed');
      window.floatingButton.pointer(phase);
    };
    button.addEventListener('pointerup', finish('up'));
    button.addEventListener('pointercancel', finish('cancel'));

    // { busy, progress, ready, flash: 'ok' | 'error' | null, title }
    window.floatingButton.onState((state) => {
      button.classList.toggle('busy', Boolean(state.busy));
      button.classList.toggle('ready', Boolean(state.ready) && !state.busy);
      button.classList.toggle('ok', state.flash === 'ok');
      button.classList.toggle('error', state.flash === 'error');
      const showProgress = state.busy && Number.isFinite(state.progress);
      progress.style.display = showProgress ? 'block' : 'none';
      progress.textContent = showProgress ? `${state.progress}%` : '';
      if (state.title) button.title = state.title;
    });
  </script>
</body>
</html>
